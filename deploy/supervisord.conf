[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
user=root

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no
priority=5
autostart=true
autorestart=true
startsecs=2
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:python-triage-api]
command=/opt/alis-venv/bin/uvicorn triage_service:app --host 127.0.0.1 --port 8000
directory=/opt/alis-python
user=alis
environment=REDIS_URL="redis://127.0.0.1:6379/0"
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:triage-worker]
command=/opt/alis-venv/bin/celery -A triage_service.celery_app worker --loglevel=INFO --pool=threads --concurrency=1
directory=/opt/alis-python
user=alis
environment=REDIS_URL="redis://127.0.0.1:6379/0"
priority=10
autostart=true
autorestart=true
startsecs=8
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:tomcat]
command=/usr/local/tomcat/bin/catalina.sh run
directory=/usr/local/tomcat
priority=20
autostart=true
autorestart=unexpected
startsecs=10
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
