[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
user=root

[program:python-triage-api]
command=/opt/alis-venv/bin/uvicorn triage_service:app --host 127.0.0.1 --port 8000
directory=/opt/alis-python
user=alis
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:triage-worker]
command=/opt/alis-venv/bin/celery -A triage_service.celery_app worker --loglevel=INFO --pool=threads --concurrency=1
directory=/opt/alis-python
user=alis
autostart=true
autorestart=true
startsecs=8
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:tomcat]
command=/usr/local/tomcat/bin/catalina.sh run
directory=/usr/local/tomcat
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
